name: 5.10 waipio build probe v5

# v4 结论: gcc-arm-linux-gnueabi 已装好; 但 clang 的 bin 目录定位错了
#   find -type d -name bin 命中了 /tmp/clang/lib64/clang/11.0.1/bin (clang 内部资源目录)
#   真正的可执行文件在同级或上级的 bin/
#   LLVM=1 下 HOSTCC=clang, 找不到 -> scripts/kconfig/parser.tab.h Error 127
#
# v5: 先找 clang 可执行文件本身, 再 dirname; 并打印完整诊断
#     同时保留 fallback: 找不到就用 runner 自带的 clang

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'BUILD_CONFIG path'
        required: false
        default: 'msm-kernel/build.config.msm.waipio'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    continue-on-error: true

    env:
      KERNEL_REPO: https://github.com/OnePlusOSS/android_kernel_oneplus_sm8450
      KERNEL_REF: oneplus/sm8450_b_16.0_oneplus_10_pro
      COMMON_REPO: https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8450
      COMMON_REF: oneplus/sm8450_s_12.1_10_pro
      MODULES_REPO: https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8450
      MODULES_REF: oneplus/sm8450_b_16.0_oneplus_10_pro
      WS: ${{ github.workspace }}/ws
      BUILD_CONFIG_PATH: ${{ github.event.inputs.config }}
      HERMETIC_TOOLCHAIN: '0'
      LTO: 'thin'

    steps:
      - name: Install cross compilers + build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu \
            bison flex libssl-dev bc zip cpio kmod libelf-dev python3

      - name: Fetch clang toolchain (robust bin detection)
        run: |
          set -e
          mkdir -p /tmp/clang && cd /tmp/clang
          curl -fL --retry 3 -o clang.tar.gz \
            "https://github.com/Rancemxn/android_kernel_oppo_sm7325/releases/download/BuildTool/linux-x86-refs_heads_llvm-r383902b-clang-r383902.tar.gz"
          tar -xzf clang.tar.gz
          rm -f clang.tar.gz

          echo "===== 解包后顶层结构 ====="
          ls -la /tmp/clang | head -20
          echo "===== 所有名为 bin 的目录 ====="
          find /tmp/clang -maxdepth 6 -type d -name bin || true
          echo "===== 真正的 clang 可执行文件 ====="
          find /tmp/clang -maxdepth 6 -type f -name clang || true
          find /tmp/clang -maxdepth 6 -type l -name clang || true

          CLANG_EXE=$(find /tmp/clang -maxdepth 6 -name clang \( -type f -o -type l \) | head -1)
          if [ -z "$CLANG_EXE" ]; then
            echo "*** 没找到 clang 可执行文件, 回退到系统 clang ***"
            CLANG_EXE=$(command -v clang || true)
          fi
          BINDIR=$(dirname "$CLANG_EXE")
          echo "CLANG_BIN=$BINDIR" >> $GITHUB_ENV
          echo "选定 clang bin: $BINDIR"
          ls "$BINDIR" | head -25
          "$CLANG_EXE" --version | head -2

      - name: Clone all sources
        run: |
          set -e
          mkdir -p "$WS/kernel_platform"
          git clone --depth 1 -b "$KERNEL_REF"  "$KERNEL_REPO"  "$WS/kernel_platform/msm-kernel"
          git clone --depth 1 -b "$COMMON_REF"  "$COMMON_REPO"  "$WS/kernel_platform/common"
          git clone --depth 1 -b "$MODULES_REF" "$MODULES_REPO" /tmp/modules
          cp -a /tmp/modules/kernel_platform/. "$WS/kernel_platform/" 2>/dev/null || true
          [ -d /tmp/modules/vendor ] && cp -a /tmp/modules/vendor "$WS/vendor" || true
          rm -rf /tmp/modules
          df -h /

      - name: Plumb clang into the expected prebuilt path
        run: |
          set -e
          D="$WS/kernel_platform/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"
          mkdir -p "$D"
          cp -a "$CLANG_BIN"/. "$D"/
          "$D/clang" --version | head -2
          echo "plumbed -> $D"

      - name: Build
        run: |
          set -o pipefail
          cd "$WS/kernel_platform"
          echo "PWD=$(pwd)  BUILD_CONFIG=$BUILD_CONFIG_PATH"
          ( BUILD_CONFIG="$BUILD_CONFIG_PATH" build/build.sh -j$(nproc) 2>&1 ) | tee /tmp/build.log
          echo "BUILD_EXIT=${PIPESTATUS[0]}"
        continue-on-error: true

      - name: Report
        if: always()
        run: |
          echo "===== key lines ====="
          grep -nE 'command not found|No such file or directory|Error [0-9]|error:|fatal error|Kernel: arch' /tmp/build.log 2>/dev/null | tail -40 || echo "(none)"
          echo "===== artifacts ====="
          find "$WS/kernel_platform/out" -maxdepth 7 \( -name 'Image' -o -name 'vmlinux' -o -name 'Image.gz' \) 2>/dev/null | head -20 || echo "(none)"
          echo "===== build.log 行数 ====="
          wc -l < /tmp/build.log 2>/dev/null || echo 0
          echo "===== tail 25 ====="
          tail -25 /tmp/build.log 2>/dev/null || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: waipio-build-log-v5
          path: /tmp/build.log
          if-no-files-found: warn
