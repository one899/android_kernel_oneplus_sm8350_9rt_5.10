name: 5.10 waipio build probe v2

# v1 侦察结论（已确认）：
#   - 布局正确：ws/kernel_platform/{build,oplus,qcom,msm-kernel,common} + ws/vendor
#     OPLUS symlink 全部解析成功，无悬空
#   - msm-kernel = 5.10.236，GKI common = 5.10.66
#   - msm-kernel 带 build.config.msm.{common,gki,lahaina,parrot,vm,waipio,waipio.tuivm}
#   - build.sh 正确用法：BUILD_CONFIG=<path> build/build.sh <make opts>
#
# v2 目标：用正确调用方式真正编 waipio。

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'BUILD_CONFIG 路径（相对 ws/kernel_platform）'
        required: false
        default: 'msm-kernel/build.config.msm.waipio'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    continue-on-error: true

    env:
      KERNEL_REPO: https://github.com/OnePlusOSS/android_kernel_oneplus_sm8450
      KERNEL_REF: oneplus/sm8450_b_16.0_oneplus_10_pro
      COMMON_REPO: https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8450
      COMMON_REF: oneplus/sm8450_s_12.1_10_pro
      MODULES_REPO: https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8450
      MODULES_REF: oneplus/sm8450_b_16.0_oneplus_10_pro
      WS: ${{ github.workspace }}/ws
      BUILD_CONFIG_PATH: ${{ github.event.inputs.config }}

    steps:
      - name: Show runner disk
        run: df -h /

      - name: Clone all sources
        run: |
          set -e
          mkdir -p "$WS/kernel_platform"
          git clone --depth 1 -b "$KERNEL_REF"  "$KERNEL_REPO"  "$WS/kernel_platform/msm-kernel"
          git clone --depth 1 -b "$COMMON_REF"  "$COMMON_REPO"  "$WS/kernel_platform/common"
          git clone --depth 1 -b "$MODULES_REF" "$MODULES_REPO" /tmp/modules
          cp -a /tmp/modules/kernel_platform/. "$WS/kernel_platform/" 2>/dev/null || true
          [ -d /tmp/modules/vendor ] && cp -a /tmp/modules/vendor "$WS/vendor" || true
          rm -rf /tmp/modules
          df -h /

      - name: Inspect the build config we are about to use
        run: |
          echo "===== $BUILD_CONFIG_PATH ====="
          cat "$WS/kernel_platform/$BUILD_CONFIG_PATH" 2>/dev/null || echo "(读不到)"
          echo
          echo "===== 同目录下其它 msm 配置 ====="
          ls -la "$WS/kernel_platform/msm-kernel"/build.config.msm.* 2>/dev/null

      - name: Build waipio (BUILD_CONFIG)
        run: |
          set -o pipefail
          cd "$WS/kernel_platform"
          echo "PWD=$(pwd)"
          echo "BUILD_CONFIG=$BUILD_CONFIG_PATH"
          nproc
          ( BUILD_CONFIG="$BUILD_CONFIG_PATH" build/build.sh -j$(nproc) 2>&1 ) | tee /tmp/build.log
          echo "BUILD_EXIT=${PIPESTATUS[0]}"
        continue-on-error: true

      - name: Report
        if: always()
        run: |
          echo "===== 结果标记 ====="
          grep -nE 'Kernel: arch/arm64/boot/Image|Kernel Image|CC |LD |Error|error:|fatal|No such file|not found|\*\*\*' /tmp/build.log 2>/dev/null | tail -60 || echo "(无 build.log)"
          echo
          echo "===== 产物 ====="
          find "$WS/kernel_platform/out" -maxdepth 4 \( -name 'Image' -o -name 'Image.gz' -o -name '*.ko' \) 2>/dev/null | head -30 || true
          ls -la "$WS/kernel_platform/out" 2>/dev/null || echo "(无 out 目录)"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: waipio-build-log
          path: /tmp/build.log
          if-no-files-found: warn
